name: probe-bench
on:
  push:
    branches: [probe-baseline-a, probe-baseline-b, probe-baseline-c]
permissions: {}
jobs:
  Benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run benchmark
        run: |
          { echo "cpu: $(awk -F': ' '/model name/{print $2; exit}' /proc/cpuinfo)   "; cat bench-fixture.txt; } | tee bench-output.txt
      - name: Read benchmark CPU
        id: cpu
        run: |
          echo "model=$(sed -n 's/^cpu: *//p' bench-output.txt | head -1 | tr -cs '[:alnum:]' '-')" >> "$GITHUB_OUTPUT"
      - name: Download previous benchmark data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./cache
          key: ${{ runner.os }}-${{ steps.cpu.outputs.model }}-benchmark-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-${{ steps.cpu.outputs.model }}-benchmark-
      - name: Store benchmark result
        uses: rhysd/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: "go"
          output-file-path: bench-output.txt
          external-data-json-path: ./cache/benchmark-data.json
          fail-on-alert: true
          max-items-in-chart: 100
      - name: Save benchmark data
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./cache
          key: ${{ runner.os }}-${{ steps.cpu.outputs.model }}-benchmark-${{ github.run_id }}
